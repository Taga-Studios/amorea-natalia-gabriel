<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;background:transparent;color:#304254;font-family:Georgia,serif}body{display:grid;place-items:center}.card{width:100%;box-sizing:border-box;text-align:center;padding:12px}.card h2{font-size:24px;font-weight:400;margin:0 0 6px}.card p{font:12px Arial,sans-serif;margin:0 0 11px}form{display:grid;gap:7px;text-align:left}input,select{box-sizing:border-box;width:100%;padding:9px;border:1px solid #d1bfa6;background:#fff;font:12px Arial,sans-serif}button{border:0;background:#304254;color:#fff;padding:10px;font:11px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.thanks{display:none;font:13px Arial,sans-serif;margin-top:12px!important}</style></head><body><div class="card"><h2>Confirma tu asistencia</h2><p>Será un placer celebrar contigo.</p><form id="rsvp-form"><input name="nombre" required placeholder="Nombre completo"><select name="asistencia" required><option value="">¿Podrás asistir?</option><option>Sí, asistiré</option><option>No podré asistir</option></select><button>Confirmar</button></form><p class="thanks">¡Gracias por tu confirmación!</p></div><script>document.getElementById('rsvp-form').addEventListener('submit',e=>{e.preventDefault();e.currentTarget.style.display='none';document.querySelector('.thanks').style.display='block'})</script></body></html>
