<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#111;font-family:"Times New Roman",serif}.card{box-sizing:border-box;width:83.333%;height:100%;margin:0 auto;padding:0 12px;text-align:left;transform:scale(1.2);transform-origin:top center}.card h2{text-align:center;font-size:22px;letter-spacing:-.8px;white-space:nowrap;font-weight:400;margin:0 0 3px}.card label{display:block;font-size:12px;margin:3px 0 2px}input{box-sizing:border-box;width:100%;height:22px;border:1px solid #a7a7a7;border-radius:5px;padding:2px 5px;font:12px "Times New Roman",serif}.choice{box-sizing:border-box;width:100%;min-height:60px;border:0;border-radius:4px;background:#d5d5d5;color:#222;margin:2px 0;padding:8px;text-align:left;font:16px "Times New Roman",serif}.submit{display:block;width:88%;margin:10px auto 0;border:0;border-radius:12px;background:#eee;color:#222;height:30px;font:16px "Times New Roman",serif}.thanks{display:none;text-align:center;font-size:12px;margin-top:10px}</style></head><body><div class="card"><h2>Confirmación de asistencia</h2><form id="rsvp-form"><label>Tu nombre:</label><input name="nombre" required><label>¿Podrás acompañarnos en nuestro gran día?</label><button class="choice" type="button" data-answer="Sí, ahí estaré!">Sí, ahí estaré!</button><button class="choice" type="button" data-answer="No podré asistir, pero los llevo en mi corazón">No podré asistir, pero los llevo en mi corazón</button><input type="hidden" name="asistencia" required><button class="submit" type="submit">Click aquí para confirmar</button></form><p class="thanks">¡Gracias por tu confirmación!</p></div><script>let answer='';document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answer=b.dataset.answer;document.querySelector('[name=asistencia]').value=answer;document.querySelectorAll('[data-answer]').forEach(x=>x.style.background='#d5d5d5');b.style.background='#c2c2c2'});document.getElementById('rsvp-form').onsubmit=e=>{e.preventDefault();if(!answer)return;e.currentTarget.style.display='none';document.querySelector('.thanks').style.display='block'}</script></body></html>
