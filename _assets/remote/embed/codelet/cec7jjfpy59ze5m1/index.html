<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;background:transparent;color:#111}body{display:grid;place-items:center}.timer{width:100%;text-align:center;font-family:"Times New Roman",serif}.units{display:flex;justify-content:center;gap:17px}.unit{min-width:64px}.number{font-size:53px;line-height:.88;font-weight:600;letter-spacing:-2px}.label{font-size:10px;letter-spacing:.08em;margin-top:6px}@media(max-width:350px){.units{gap:10px}.unit{min-width:56px}.number{font-size:46px}}</style></head><body><div class="timer"><div class="units"><div class="unit"><div class="number" id="days">00</div><div class="label">DÍAS</div></div><div class="unit"><div class="number" id="hours">00</div><div class="label">HORAS</div></div><div class="unit"><div class="number" id="minutes">00</div><div class="label">MINUTOS</div></div></div></div><script>const target=new Date("2027-01-09T14:00:00-06:00");function tick(){let n=Math.max(0,Math.floor((target-Date.now())/1000)),d=Math.floor(n/86400);n%=86400;const h=Math.floor(n/3600);n%=3600;const m=Math.floor(n/60);Object.entries({days:d,hours:h,minutes:m}).forEach(([k,v])=>document.getElementById(k).textContent=String(v).padStart(2,"0"))}tick();setInterval(tick,1000);</script></body></html>
